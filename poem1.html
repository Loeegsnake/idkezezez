<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>詩的賞析1 - 李白《將進酒》</title>
    <!-- 網頁內嵌式樣式設定 -->
    <style>
        /* *1 整頁背景設為粉紅色 */
        body {
            background-color: pink;
            text-align: center;
            font-family: "PMingLiU", "KaiTi", "DFKai-SB", "Microsoft JhengHei", serif;
            margin: 40px auto;
            padding: 0 20px;
        }
        /* *2 詩的標題設為: 藍色、40點字 */
        .poem-title {
            color: blue;
            font-size: 40pt;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .poet-info {
            font-size: 16pt;
            margin-bottom: 20px;
        }
        /* *3 頁面中央放1楨李白的畫像圖(長或寬為300px)，深紫色圖框線(5px)、四周做成圓角(半徑50px) */
        .portrait-container {
            text-align: center;
            margin: 20px auto;
        }
        .portrait {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border: 5px solid darkviolet;
            border-radius: 50px;
            display: block;
            margin: 0 auto;
        }
        /* *2 詩的內容設為: 綠色、30點字 */
        .poem-content {
            color: green;
            font-size: 30pt;
            line-height: 1.6;
            margin-top: 25px;
        }
        .nav-back {
            margin-top: 40px;
            font-size: 14pt;
        }
    </style>
</head>
<body>
    <h1 class="poem-title">將進酒</h1>
    <div class="poet-info">
        唐代詩人：<a href="https://fanti.dugushici.com/ancient_proses/7545" target="_blank" rel="noopener noreferrer">李白</a>
    </div>

    <div class="portrait-container">
        <img src="libai.jpg" alt="李白畫像" class="portrait">
    </div>

    <div class="poem-content">
        <p>君不見，黃河之水天上來，奔流到海不復回。</p>
        <p>君不見，高堂明鏡悲白髮，朝如青絲暮成雪。</p>
        <p>人生得意須盡歡，莫使金樽空對月。</p>
        <p>天生我材必有用，千金散盡還復來。</p>
        <p>烹羊宰牛且爲樂，會須一飲三百杯。</p>
        <p>岑夫子，丹丘生，將進酒，杯莫停。</p>
        <p>與君歌一曲，請君爲我傾耳聽。</p>
        <p>鐘鼓饌玉不足貴，但願長醉不復醒。</p>
        <p>古來聖賢皆寂寞，惟有飲者留其名。</p>
        <p>陳王昔時宴平樂，斗酒十千恣歡謔。</p>
        <p>主人何爲言少錢，徑須沽取對君酌。</p>
        <p>五花馬，千金裘，呼兒將出換美酒，與爾同銷萬古愁。</p>
    </div>
