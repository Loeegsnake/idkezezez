    <title>詩的賞析2 - 劉禹錫《烏衣巷》</title>
    <!-- 網頁外部匯入樣式設定 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="poem-title">烏衣巷</h1>
    <div class="poet-info">
        唐代詩人：<a href="https://fanti.dugushici.com/ancient_proses/18745" target="_blank" rel="noopener noreferrer">劉禹錫</a>
    </div>

    <div class="portrait-container">
        <img src="liuyuxi.jpg" alt="劉禹錫畫像" class="portrait">
    </div>

    <div class="poem-content">
        <p>朱雀橋邊野草花，</p>
        <p>烏衣巷口夕陽斜。</p>
        <p>舊時王謝堂前燕，</p>
        <p>飛入尋常百姓家。</p>
    </div>
